robot:
  name: "hamals_robot"
  type: "forklift_agv"

  # Robot koordinat sistemi:
  # x: ileri yön / forklift bıçaklarının baktığı yön
  # y: sağ-sol yön
  # z: yukarı yön
  frames:
    base_footprint: "base_footprint"
    base_link: "base_link"

    forklift_mast_link: "forklift_mast_link"
    fork_carriage_link: "fork_carriage_link"
    left_fork_link: "left_fork_link"
    right_fork_link: "right_fork_link"

    rear_left_wheel_link: "rear_left_wheel_link"
    rear_right_wheel_link: "rear_right_wheel_link"
    rear_center_caster_link: "rear_center_caster_link"

    lidar_mount_link: "lidar_mount_link"
    lidar_link: "lidar_link"

units:
  # Tüm uzunluk ölçüleri metre cinsindendir.
  length: "meter"

  # Tüm açı değerleri radyan cinsindendir.
  angle: "radian"

base:
  # Robotun ana dikdörtgen gövdesi.
  length: 0.70
  width: 0.45
  height: 0.35

  # base_link, gövdenin geometrik merkezindedir.
  # base_footprint zemindedir.
  # base_link z yüksekliği = gövde yüksekliği / 2
  origin:
    xyz: [0.0, 0.0, 0.175]
    rpy: [0.0, 0.0, 0.0]

  collision:
    length: 0.70
    width: 0.45
    height: 0.35

forklift:
  mast:
    enabled: true

    # Forkliftin ön tarafındaki sabit dikey kaldırma sistemi.
    # Ön taraf +X yönüdür.
    height: 0.60
    width: 0.36
    depth: 0.05

    # Gövdenin ön yüzü x = +0.35 olduğu için mast burada konumlandırılır.
    origin:
      xyz: [0.35, 0.0, 0.30]
      rpy: [0.0, 0.0, 0.0]

    joint:
      name: "forklift_mast_joint"
      type: "fixed"
      parent: "base_link"
      child: "forklift_mast_link"

    columns:
      left:
        width: 0.06
        depth: 0.05
        height: 0.60

        # +Y robotun soludur.
        origin:
          xyz: [0.0, 0.14, 0.0]
          rpy: [0.0, 0.0, 0.0]

      right:
        width: 0.06
        depth: 0.05
        height: 0.60

        # -Y robotun sağıdır.
        origin:
          xyz: [0.0, -0.14, 0.0]
          rpy: [0.0, 0.0, 0.0]

  carriage:
    enabled: true

    # Forklift bıçaklarını taşıyan hareketli kızak.
    # Mast üzerinde z ekseninde yukarı-aşağı hareket eder.
    width: 0.36
    depth: 0.04
    height: 0.12

    # forklift_mast_link'e göre tanımlıdır.
    origin:
      xyz: [0.03, 0.0, -0.375]
      rpy: [0.0, 0.0, 0.0]

    joint:
      name: "forklift_lift_joint"
      type: "prismatic"
      parent: "forklift_mast_link"
      child: "fork_carriage_link"

      # Yukarı-aşağı kaldırma hareketi.
      axis: [0.0, 0.0, 1.0]

      limit:
        # En alt konum.
        lower: 0.0

        # Maksimum kaldırma yüksekliği.
        # 0.35 = 35 cm.
        upper: 0.35

        # Gazebo / ros2_control için maksimum kuvvet.
        effort: 100.0

        # Maksimum kaldırma hızı.
        velocity: 0.15

  forks:
    enabled: true

    # Forklift bıçakları fork_carriage_link'e bağlıdır.
    # Carriage yukarı kalkınca bıçaklar da birlikte yukarı kalkar.
    length: 0.45
    width: 0.06
    height: 0.04

    # Bıçaklar +X yönünde ileri doğru uzanır.
    left:
      origin:
        xyz: [0.225, 0.14, -0.08]
        rpy: [0.0, 0.0, 0.0]

      joint:
        name: "left_fork_joint"
        type: "fixed"
        parent: "fork_carriage_link"
        child: "left_fork_link"

    right:
      origin:
        xyz: [0.225, -0.14, -0.08]
        rpy: [0.0, 0.0, 0.0]

      joint:
        name: "right_fork_joint"
        type: "fixed"
        parent: "fork_carriage_link"
        child: "right_fork_link"

wheels:
  rear_left:
    enabled: true
    type: "drive_wheel"

    # Sol ana sürüş tekeri.
    # Bu teker forklift kaldırma mekanizmasına yakın, ön tarafta bulunur.
    radius: 0.075
    width: 0.04

    # +X ön taraf, +Y sol taraf.
    origin:
      xyz: [0.25, 0.245, -0.12]
      rpy: [1.5708, 0.0, 0.0]

    joint:
      name: "rear_left_wheel_joint"
      type: "continuous"
      parent: "base_link"
      child: "rear_left_wheel_link"

      axis: [0.0, 0.0, 1.0]

  rear_right:
    enabled: true
    type: "drive_wheel"

    # Sağ ana sürüş tekeri.
    # Bu teker forklift kaldırma mekanizmasına yakın, ön tarafta bulunur.
    radius: 0.075
    width: 0.04

    # +X ön taraf, -Y sağ taraf.
    origin:
      xyz: [0.25, -0.245, -0.12]
      rpy: [1.5708, 0.0, 0.0]

    joint:
      name: "rear_right_wheel_joint"
      type: "continuous"
      parent: "base_link"
      child: "rear_right_wheel_link"

      axis: [0.0, 0.0, 1.0]

caster:
  rear_center:
    enabled: true

    # Arka orta denge caster tekeri.
    # Ana sürüş tekerleri ön/kaldırma mekanizması tarafında,
    # caster ise robotu dengelemek için arka orta noktadadır.
    radius: 0.04

    # Gövdenin arka yüzü x = -0.35.
    # Caster yarıçapı 0.04 olduğu için merkez yaklaşık -0.39 seçildi.
    origin:
      xyz: [-0.28, 0.0, -0.155]
      rpy: [0.0, 0.0, 0.0]

    joint:
      name: "rear_center_caster_joint"
      type: "fixed"
      parent: "base_link"
      child: "rear_center_caster_link"

lidar_mount:
  enabled: true

  # LiDAR mount gövdenin üstünde tam ortaya yerleştirilir.
  radius: 0.06
  height: 0.04

  # base_link gövde merkezindedir.
  # z = base_height / 2 + mount_height / 2
  # 0.175 + 0.02 = 0.195, görsel olarak 0.20 seçildi.
  origin:
    xyz: [0.0, 0.0, 0.20]
    rpy: [0.0, 0.0, 0.0]

  joint:
    name: "lidar_mount_joint"
    type: "fixed"
    parent: "base_link"
    child: "lidar_mount_link"

lidar:
  enabled: true
  type: "cylindrical_2d_lidar"

  radius: 0.045
  height: 0.04

  # lidar_mount_link'e göredir.
  origin:
    xyz: [0.0, 0.0, 0.04]
    rpy: [0.0, 0.0, 0.0]

  joint:
    name: "lidar_joint"
    type: "fixed"
    parent: "lidar_mount_link"
    child: "lidar_link"

  ros:
    topic: "/scan"
    frame_id: "lidar_link"

materials:
  base:
    name: "base_light_gray"
    color: [0.75, 0.75, 0.75, 1.0]

  forklift_mast:
    name: "mast_dark_gray"
    color: [0.25, 0.25, 0.25, 1.0]

  fork_carriage:
    name: "carriage_gray"
    color: [0.35, 0.35, 0.35, 1.0]

  forks:
    name: "fork_dark_gray"
    color: [0.30, 0.30, 0.30, 1.0]

  wheels:
    name: "wheel_black"
    color: [0.02, 0.02, 0.02, 1.0]

  caster:
    name: "caster_black"
    color: [0.02, 0.02, 0.02, 1.0]

  lidar_mount:
    name: "lidar_mount_gray"
    color: [0.20, 0.20, 0.20, 1.0]

  lidar:
    name: "lidar_blue"
    color: [0.0, 0.2, 0.8, 1.0]

physics:
  default_friction:
    mu1: 1.0
    mu2: 1.0

  default_contact:
    kp: 100000.0
    kd: 10.0

inertial:
  base:
    mass: 18.0
    ixx: 0.35
    ixy: 0.0
    ixz: 0.0
    iyy: 0.80
    iyz: 0.0
    izz: 0.95

  forklift_mast:
    mass: 2.0
    ixx: 0.05
    ixy: 0.0
    ixz: 0.0
    iyy: 0.05
    iyz: 0.0
    izz: 0.02

  fork_carriage:
    mass: 1.5
    ixx: 0.02
    ixy: 0.0
    ixz: 0.0
    iyy: 0.03
    iyz: 0.0
    izz: 0.04

  fork:
    mass: 0.8
    ixx: 0.01
    ixy: 0.0
    ixz: 0.0
    iyy: 0.03
    iyz: 0.0
    izz: 0.03

  wheel:
    mass: 0.7
    ixx: 0.002
    ixy: 0.0
    ixz: 0.0
    iyy: 0.002
    iyz: 0.0
    izz: 0.001

  caster:
    mass: 0.3
    ixx: 0.001
    ixy: 0.0
    ixz: 0.0
    iyy: 0.001
    iyz: 0.0
    izz: 0.001

  lidar_mount:
    mass: 0.2
    ixx: 0.0005
    ixy: 0.0
    ixz: 0.0
    iyy: 0.0005
    iyz: 0.0
    izz: 0.0005

  lidar:
    mass: 0.25
    ixx: 0.0008
    ixy: 0.0
    ixz: 0.0
    iyy: 0.0008
    iyz: 0.0
    izz: 0.0008

gazebo:
  enabled: true

  materials:
    base: "Gazebo/Grey"
    forklift_mast: "Gazebo/DarkGrey"
    fork_carriage: "Gazebo/Grey"
    forks: "Gazebo/DarkGrey"
    wheels: "Gazebo/Black"
    caster: "Gazebo/Black"
    lidar_mount: "Gazebo/DarkGrey"
    lidar: "Gazebo/Blue"

  wheels:
    friction:
      mu1: 1.2
      mu2: 1.2

  caster:
    friction:
      mu1: 0.4
      mu2: 0.4

  lidar:
    enabled: true
    topic: "/scan"
    frame_name: "lidar_link"
    update_rate: 10.0

    scan:
      samples: 720
      resolution: 1
      min_angle: -3.14159
      max_angle: 3.14159

    range:
      min: 0.12
      max: 12.0
      resolution: 0.01

    noise:
      type: "gaussian"
      mean: 0.0
      stddev: 0.01

ros2_control:
  enabled: true

  hardware:
    name: "GazeboSystem"
    plugin: "gz_ros2_control/GazeboSimSystem"

  joints:
    rear_left_wheel_joint:
      command_interfaces: ["velocity"]
      state_interfaces: ["position", "velocity"]

    rear_right_wheel_joint:
      command_interfaces: ["velocity"]
      state_interfaces: ["position", "velocity"]

    forklift_lift_joint:
      command_interfaces: ["position"]
      state_interfaces: ["position", "velocity"]

controllers:
  diff_drive:
    enabled: true
    name: "diff_drive_controller"

    left_wheel_names: ["rear_left_wheel_joint"]
    right_wheel_names: ["rear_right_wheel_joint"]

    wheel_separation: 0.49
    wheel_radius: 0.075

    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

  forklift_lift:
    enabled: true
    name: "forklift_lift_controller"

    joint: "forklift_lift_joint"
    command_interface: "position"

    min_position: 0.0
    max_position: 0.35